site_name: 周璇的数据分析作品集
site_url: https://ankateam.xyz/
site_description: 数据分析 / 数据运营个人作品集
theme:
  name: material
  language: zh
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
nav:
  - 首页: index.md
  - 作品集:
      - 供应链数据看板: projects/supply-chain.md
      - 投放数据看板: projects/ad-dashboard.md
  - 关于我: about.md
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
